# OCO-2 SIF — Nadir over land (MeasurementMode==0, sounding_land_fraction>50).
filePattern = "oco2_LtSIF_YYMMDD_*.nc4"
folder = "/kiwi-data/Data/satellite/OCO2/L2_Lite_SIF/11.2r/raw/YYYY/"
[basic]
lat = "Latitude"
lon = "Longitude"
lat_bnd = "Latitude_Corners"
lon_bnd = "Longitude_Corners"
[grid]
sifdaily_nd_land = "Daily_SIF_757nm"
sif757_nd_land = "Science/SIF_757nm"
sif771_nd_land = "Science/SIF_771nm"
[filter]
Quality_Flag = "== 0"
"Metadata/MeasurementMode" = "== 0"
"Science/sounding_land_fraction" = "> 50"
